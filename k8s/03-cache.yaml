apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: carequeue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: carequeue
spec:
  selector:
    app: cache
  ports:
    - port: 6379
