apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: carequeue-web
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["carequeue"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: web
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "5000"
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_track]
            target_label: track
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alerts.yml: |
    groups:
      - name: carequeue
        rules:
          - alert: CareQueuePodDown
            expr: up{job="carequeue-web"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "CareQueue pod {{ $labels.pod }} ({{ $labels.track }}) is not responding"
          - alert: CareQueueHighErrorRate
            expr: sum(rate(flask_http_request_total{status=~"5.."}[5m])) / sum(rate(flask_http_request_total[5m])) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "More than 5% of CareQueue requests are failing"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
