apiVersion: v1
kind: Namespace
metadata:
  name: carequeue
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: carequeue-config
  namespace: carequeue
data:
  DB_HOST: db
  DB_NAME: careq
  DB_USER: careq
  REDIS_HOST: cache
  APP_VERSION: v1
  APP_COLOR: blue
---
# The Secret "carequeue-secret" (DB_PASSWORD) is created directly in the
# cluster with kubectl and is never stored in Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: carequeue
data:
  default.conf: |
    server {
        listen 80;
        location / {
            proxy_pass http://web:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
