apiVersion: v1
kind: Namespace
metadata:
  name: carequeue
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: carequeue-config
  namespace: carequeue
data:
  DB_HOST: db
  DB_NAME: careq
  DB_USER: careq
  REDIS_HOST: cache
  APP_VERSION: v1
  APP_COLOR: blue
---
# The Secret "carequeue-secret" (DB_PASSWORD) is created directly in the
# cluster with kubectl and is never stored in Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: carequeue
data:
  default.conf: |
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

    server {
        listen 80;
        server_tokens off;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'" always;

        location / {
            limit_req zone=perip burst=20 nodelay;
            proxy_pass http://web:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
