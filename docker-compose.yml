services:
  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
  web:
    restart: unless-stopped
    build: .
    image: carequeue-web:v1
    environment:
      DB_HOST: db
      DB_NAME: careq
      DB_USER: careq
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: cache
      APP_VERSION: v1
      APP_COLOR: blue
    depends_on:
      - db
      - cache
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careq
      POSTGRES_USER: careq
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
  cache:
    restart: unless-stopped
    image: redis:7-alpine
volumes:
  dbdata:
